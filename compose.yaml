services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: lesine
      POSTGRES_USER: lesine
      POSTGRES_PASSWORD: ${LESINE_DB_PASSWORD:?Set LESINE_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lesine -d lesine"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    command: ["node", "apps/api/dist/main.js"]
    environment: &database_environment
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: lesine
      PGUSER: lesine
      PGPASSWORD: ${LESINE_DB_PASSWORD:?Set LESINE_DB_PASSWORD in .env}
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    command: ["node", "apps/worker/dist/main.js"]
    environment: *database_environment
    volumes:
      - provider_responses:/data/provider-responses
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres_data:
  provider_responses:
