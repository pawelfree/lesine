<!doctype html><html lang="en"><meta charset="utf-8"><title>Data model</title><style>body{font:16px system-ui;margin:1rem;background:#f8fafc;color:#111}svg{width:100%;height:75vh;border:1px solid #cbd5e1;background:white;touch-action:none}button{margin:.3rem;padding:.4rem}.node{cursor:pointer}text{pointer-events:none}</style><h1>Data model</h1><p>Drag to pan, scroll to zoom, click a node to focus its direct relations.</p><button id="reset">Reset</button><svg id="canvas" viewBox="0 0 850 430" aria-label="Interactive data-model graph"></svg><script>const graph={"nodes":[{"id":"entity_1","label":"CorporateActionRevision","new":true,"x":110,"y":90},{"id":"entity_2","label":"ActionManifestRevision","new":true,"x":360,"y":90},{"id":"entity_3","label":"ImportChunk","new":false,"x":610,"y":90},{"id":"entity_4","label":"RawFileManifest","new":false,"x":110,"y":250},{"id":"entity_5","label":"SourceSymbol","new":false,"x":360,"y":250}],"edges":[["entity_1","entity_5"],["entity_1","entity_4"],["entity_2","entity_1"],["entity_2","entity_4"],["entity_4","entity_3"]]};const svg=document.getElementById('canvas');const ns='http://www.w3.org/2000/svg';const root=document.createElementNS(ns,'g');svg.append(root);const byId=new Map(graph.nodes.map(n=>[n.id,n]));const edgeEls=[];function element(name,attrs){const e=document.createElementNS(ns,name);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));return e}for(const [a,b] of graph.edges){const x=byId.get(a),y=byId.get(b);const line=element('line',{x1:x.x+75,y1:x.y+24,x2:y.x+75,y2:y.y+24,stroke:'#64748b','stroke-width':2});root.append(line);edgeEls.push([line,a,b])}const nodeEls=[];for(const n of graph.nodes){const g=element('g',{class:'node',tabindex:0,role:'button','aria-label':n.label});const r=element('rect',{x:n.x,y:n.y,width:150,height:48,rx:8,fill:n.new?'#2f6feb':'#e5e7eb'});const t=element('text',{x:n.x+75,y:n.y+29,'text-anchor':'middle',fill:n.new?'white':'#111','font-size':13});t.textContent=n.label;g.append(r,t);root.append(g);g.addEventListener('click',()=>focus(n.id));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();focus(n.id)}});nodeEls.push([g,n.id])}function focus(id){const keep=new Set([id]);for(const [a,b] of graph.edges)if(a===id||b===id){keep.add(a);keep.add(b)}for(const [e,n] of nodeEls)e.style.opacity=keep.has(n)?1:.2;for(const [e,a,b] of edgeEls)e.style.opacity=a===id||b===id?1:.1}function reset(){for(const [e] of nodeEls)e.style.opacity=1;for(const [e] of edgeEls)e.style.opacity=1;scale=1;dx=0;dy=0;transform()}document.getElementById('reset').addEventListener('click',reset);let dx=0,dy=0,scale=1,drag=null;function transform(){root.setAttribute('transform',`translate(${dx} ${dy}) scale(${scale})`)}svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;dx+=e.clientX-drag.x;dy+=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};transform()});svg.addEventListener('pointerup',()=>{drag=null});svg.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.3,Math.min(3,scale*(e.deltaY<0?1.1:.9)));transform()},{passive:false});</script></html>
